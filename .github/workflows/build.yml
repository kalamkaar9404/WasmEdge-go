name: build
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

jobs:
  build_ubuntu:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 1
      USE_BAZEL_VERSION: 7.4.1
    strategy:
      matrix:
        go: [ '1.22.x', '1.23.x' ]
    name: Build WasmEdge-go on Ubuntu with Go ${{ matrix.go }}
    steps:
      - uses: actions/checkout@v4
      - name: Install go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Install and Test
        run: |
          wget -qO- https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bash -s -- -v 0.14.0
      
      - name: Bazel Test
        run: |   
          bazel test //... \
            --test_output=errors \
            --copt="-I$HOME/.wasmedge/include" \
            --linkopt="-L$HOME/.wasmedge/lib" \
            --action_env=LD_LIBRARY_PATH=$HOME/.wasmedge/lib \
            --action_env=DYLD_LIBRARY_PATH=$HOME/.wasmedge/lib \
            --@io_bazel_rules_go//go/config:pure=false
  build_macos:
    runs-on: macos-14
    env:
      CGO_ENABLED: 1
      USE_BAZEL_VERSION: 7.4.1
    strategy:
      matrix:
        go: [ '1.22.x', '1.23.x' ]
    name: Build WasmEdge-go on MacOS with Go ${{ matrix.go }}
    steps:
      - uses: actions/checkout@v4
      - name: Install go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Install and Test
        run: |
          curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bash -s -- -v 0.14.0
      - name: Bazel Test
        run: |  
          bazel test //... \
            --test_output=errors \
            --copt="-I$HOME/.wasmedge/include" \
            --linkopt="-L$HOME/.wasmedge/lib" \
            --action_env=LD_LIBRARY_PATH=$HOME/.wasmedge/lib \
            --action_env=DYLD_LIBRARY_PATH=$HOME/.wasmedge/lib \
            --@io_bazel_rules_go//go/config:pure=false